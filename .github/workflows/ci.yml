name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.22 is the version declared in go.mod. Testing it is the only thing
        # that keeps the floor honest: the library is deliberately buildable on
        # older toolchains, and it is very easy to break that by accident (for
        # example by "simplifying" wg.Add/wg.Done into wg.Go, which needs 1.25).
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: test with the race detector
        run: go test ./... -race -count=1

      - name: run the examples
        run: |
          go run ./examples/basic
          go run ./examples/limit
          go run ./examples/cancel
